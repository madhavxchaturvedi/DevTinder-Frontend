    <meta charset="UTF-8" />
    <script>
      (function() {
        if (window.location.pathname === '/' || window.location.pathname === '') {
          try {
            var hasAuth = localStorage.getItem('octopair_auth_hint') === 'true' ||
                          localStorage.getItem('devtinder_auth_hint') === 'true' ||
                          localStorage.getItem('octopair_auth') === '1' ||
                          localStorage.getItem('devtinder_auth') === '1' ||
                          (document.cookie && document.cookie.indexOf('auth_hint=true') !== -1);
            if (hasAuth) {
              sessionStorage.setItem('octopair_from_root', '1');
              window.location.replace('/feed');
            }
          } catch (e) {}
        }
      })();
    </script>
